version: '3.8'
services:
  indexs-mcp:
    build: .
    container_name: indexs-mcp
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    volumes:
      - ./config.json:/app/config.json:ro
      - ./tools:/app/tools:ro
      - ./src/main/resources/application.yml:/app/application.yml:ro

